<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPub Logo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo-container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo-title {
            color: #1a365d;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .logo-description {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .logo-variations {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .logo-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            border: 2px solid #e9ecef;
        }

        .logo-label {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <h1 class="logo-title">StockPub Logo 设计</h1>
        <p class="logo-description">为 A 股实时数据订阅服务设计的专业 logo</p>

        <div class="logo-variations">
            <div class="logo-item">
                <img src="logo.svg" alt="StockPub Logo" width="200" height="80">
                <div class="logo-label">主版本</div>
            </div>
        </div>

        <div style="margin-top: 30px; color: #666; font-size: 12px;">
            <p>设计元素说明：</p>
            <ul style="text-align: left; display: inline-block;">
                <li>📈 绿色上升趋势线代表股票上涨和数据增长</li>
                <li>🔵 深蓝色背景体现专业和科技感</li>
                <li>📊 数据点突出实时数据监控特性</li>
                <li>🎯 简洁设计适合各种应用场景</li>
            </ul>
        </div>
    </div>
</body>
</html>
